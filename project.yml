name: FontaDynamicNotch
options:
  bundleIdPrefix: com.fonta
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FontaDynamicNotch:
    type: application
    platform: macOS
    sources: [App, Notch, Services, Features, Settings]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Fonta's Dynamic Notch"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSAppleEventsUsageDescription: "Used to show and control what's playing in Spotify."
    entitlements:
      path: App/FontaDynamicNotch.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fonta.dynamicnotch
        ENABLE_HARDENED_RUNTIME: YES
        # Personal Team "Apple Development" certificate (not ad-hoc), so macOS permissions
        # (Spotify automation, notifications) persist between builds.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: FSB3QG2BP4
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
